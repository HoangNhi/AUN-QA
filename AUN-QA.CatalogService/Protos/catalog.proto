syntax = "proto3";

import "google/protobuf/wrappers.proto";

option csharp_namespace = "AUN_QA.CatalogService.Protos";

package catalog;

service CatalogProto {
  rpc GetStakeholdersStream (GetStakeholdersStreamRequest) returns (stream StakeholderMinimalInfo);
}

message GetStakeholdersStreamRequest {
  google.protobuf.Int32Value stakeholder_type = 1;
}

message StakeholderMinimalInfo {
  string id = 1;
  string full_name = 2;
  string email = 3;
  int32 type = 4;
  string description = 5;
}