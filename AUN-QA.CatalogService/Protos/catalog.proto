syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "AUN_QA.CatalogService.Protos";

package catalog;

service CatalogProto {
  rpc GetStakeholdersStream (GetStakeholdersStreamRequest) returns (stream StakeholderInfo);
  rpc GetCriterionsForEvidenceStream (GetCriterionsForEvidenceStreamRequest) returns (stream CriterionInfo);
  rpc GetFileTypesStream (GetFileTypesStreamRequest) returns (stream FileTypeInfo);
  rpc GetFileTypesByCriterionStream (GetFileTypesByCriterionStreamRequest) returns (stream FileTypeInfo);
  rpc GetStandardsWithCriteriaStream (GetStandardsWithCriteriaStreamRequest) returns (stream StandardWithCriteriaInfo);
}

message GetStakeholdersStreamRequest {
  google.protobuf.StringValue id = 1;
  google.protobuf.Int32Value stakeholder_type = 2;
}

message StakeholderInfo {
  string id = 1;
  string full_name = 2;
  string email = 3;
  int32 type = 4;
  string description = 5;
}

// Standard service
message CriterionInfo {
  string id = 1;
  string standard_id = 2;
  string code = 3;
  string name = 4;
  bool is_prerequisite = 5;
  string diagnostic_questions = 6;
  string description = 7;
  int32 order = 8;
}

message GetCriterionsForEvidenceStreamRequest {
  string file_type_id = 1;
  string standard_set_id = 2;
}

// FileType
message FileTypeInfo {
  string id = 1;
  string code = 2;
  string name = 3;
  optional string description = 4;
}

message GetFileTypesStreamRequest {
  google.protobuf.StringValue id = 1;
}

message GetFileTypesByCriterionStreamRequest {
  string criterion_id = 1;
}

// CriterionEvaluation - Standards with Criteria
message GetStandardsWithCriteriaStreamRequest {
  string standard_set_id = 1;
}

message StandardWithCriteriaInfo {
  string standard_id = 1;
  string standard_code = 2;
  string standard_name = 3;
  int32 standard_order = 4;
  string criterion_id = 5;
  string criterion_code = 6;
  string criterion_name = 7;
  bool is_prerequisite = 8;
  int32 criterion_order = 9;
}