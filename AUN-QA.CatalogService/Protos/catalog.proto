syntax = "proto3";

import "google/protobuf/wrappers.proto";

option csharp_namespace = "AUN_QA.CatalogService.Protos";

package catalog;

service CatalogProto {
  rpc GetStakeholdersStream (GetStakeholdersStreamRequest) returns (stream StakeholderMinimalInfo);
  rpc IsUserInRole (IsUserInRoleRequest) returns (google.protobuf.BoolValue);
  rpc GetUserRole (GetUserRoleRequest) returns (google.protobuf.Int32Value);
}

message GetStakeholdersStreamRequest {
  google.protobuf.Int32Value stakeholder_type = 1;
}

message StakeholderMinimalInfo {
  string id = 1;
  string full_name = 2;
  string email = 3;
  int32 type = 4;
  string description = 5;
}

message IsUserInRoleRequest {
  string cycle_id = 1;
  string user_id = 2;
  int32 role = 3;
}

message GetUserRoleRequest {
  string cycle_id = 1;
  string user_id = 2;
}